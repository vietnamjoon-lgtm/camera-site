<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="찰칵 부스" />
  <title>찰칵 부스</title>
  <link rel="stylesheet" href="../apple.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="view"></canvas>
  <!-- 얼굴 스티커는 효과 화면 위에 겹친 이 캔버스에 그린다 -->
  <canvas id="overlay"></canvas>

  <div id="grid" class="hidden"></div>
  <div id="label" class="hidden"></div>
  <div id="countdown" class="hidden"></div>
  <div id="flash"></div>

  <!-- 입장 화면: 기능 소개 + 모드를 골라서 바로 시작 -->
  <div id="start-screen">
    <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="sparkles" aria-hidden="true">
      <i style="--x: 12%; --y: 18%; --d: 0s"></i>
      <i style="--x: 84%; --y: 12%; --d: 1.2s"></i>
      <i style="--x: 70%; --y: 34%; --d: 2.4s"></i>
      <i style="--x: 22%; --y: 62%; --d: 0.6s"></i>
      <i style="--x: 90%; --y: 70%; --d: 1.8s"></i>
      <i style="--x: 8%; --y: 88%; --d: 3s"></i>
      <i style="--x: 52%; --y: 8%; --d: 2s"></i>
      <i style="--x: 60%; --y: 92%; --d: 0.9s"></i>
    </div>

    <main class="intro">
      <h1 class="title">찰칵 부스</h1>
      <p class="tagline">효과·스티커·배경을 골라서 찍어요</p>

      <ul class="features">
        <li><span class="icon">✨</span><b>효과 18가지</b><span>볼록 렌즈, 소용돌이, 만화…</span></li>
        <li><span class="icon">🎞</span><b>네 컷</b><span>네 장 찍고 프레임 골라 합치기</span></li>
        <li><span class="icon">🔁</span><b>움짤</b><span>2초 찍어서 부메랑 GIF</span></li>
        <li><span class="icon">😺</span><b>얼굴 스티커</b><span>귀·선글라스·왕관이 따라다녀요</span></li>
        <li><span class="icon">🌄</span><b>배경 바꾸기</b><span>우주, 바다, 내 사진까지</span></li>
      </ul>

      <p class="start-hint">어떻게 찍을까요?</p>
      <div id="start-buttons" role="group" aria-label="찍는 방식 골라서 시작">
        <button type="button" data-mode="single"><span class="icon">📷</span><span>한 장</span></button>
        <button type="button" data-mode="four"><span class="icon">🎞</span><span>네 컷</span></button>
        <button type="button" data-mode="boomerang"><span class="icon">🔁</span><span>움짤</span></button>
      </div>
      <p id="error"></p>
    </main>
  </div>

  <div id="mode" class="hidden" role="group" aria-label="찍는 방식">
    <button type="button" data-mode="single" class="on">한 장</button>
    <button type="button" data-mode="four">네 컷</button>
    <button type="button" data-mode="boomerang">움짤</button>
  </div>

  <div id="tools" class="hidden">
    <button id="sticker-btn" class="side" type="button" aria-label="얼굴 스티커 고르기">
      <span class="icon">😺</span><span>스티커</span>
    </button>
    <button id="bg-btn" class="side" type="button" aria-label="배경 고르기">
      <span class="icon">🌄</span><span>배경</span>
    </button>
  </div>
  <!-- 스티커·배경 고르는 줄 (셔터 위) -->
  <div id="picker" class="hidden" role="group"></div>
  <input id="photo" type="file" accept="image/*" hidden />

  <footer id="bar" class="hidden">
    <button id="effects" class="side" type="button" aria-label="효과 고르기">
      <span class="icon">▦</span><span>효과</span>
    </button>
    <button id="shutter" type="button" aria-label="사진 찍기"></button>
    <button id="thumb" class="side" type="button" aria-label="방금 찍은 사진">
      <img id="thumb-img" alt="" />
      <span id="thumb-badge"></span>
    </button>
  </footer>

  <footer id="grid-bar" class="hidden">
    <button id="prev" class="side" type="button" aria-label="이전 효과">‹</button>
    <span id="page"></span>
    <button id="next" class="side" type="button" aria-label="다음 효과">›</button>
  </footer>

  <!-- 네 컷을 다 찍으면 뜨는 결과 화면 -->
  <div id="result" class="hidden">
    <img id="result-img" alt="네 컷 미리보기" />
    <div id="result-controls">
      <div id="layouts" class="segmented" role="group" aria-label="모양"></div>
      <div id="colors" role="group" aria-label="프레임 색"></div>
      <input id="caption" type="text" maxlength="20" placeholder="아래에 넣을 글씨 (비우면 없음)" aria-label="아래에 넣을 글씨" />
      <div id="result-actions">
        <button id="retake" type="button">다시 찍기</button>
        <button id="save" type="button">저장</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
