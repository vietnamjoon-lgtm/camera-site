<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="찰칵 부스" />
  <title>찰칵 부스</title>
  <link rel="stylesheet" href="../apple.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="view"></canvas>
  <!-- 얼굴 스티커는 효과 화면 위에 겹친 이 캔버스에 그린다 -->
  <canvas id="overlay"></canvas>

  <div id="grid" class="hidden"></div>
  <div id="label" class="hidden"></div>
  <div id="countdown" class="hidden"></div>
  <div id="flash"></div>

  <!-- 입장 화면: 부스 구멍에서 나오는 견본(한 장은 폴라로이드, 네 컷은 네 컷, 움짤은 움직이는 사진) + 카메라 안과 같은 모드 전환·셔터 -->
  <div id="start-screen">
    <div class="booth">
      <figure class="print">
        <div class="slot" aria-hidden="true"></div>
        <div class="paper">
          <img id="sample-polaroid" class="sheet hidden" alt="견본 폴라로이드: 분홍 배경에 강아지 귀" />
          <canvas id="sample-gif" class="sheet hidden" role="img" aria-label="견본 움짤: 무지개 앞에서 토끼 귀를 하고 고개를 까딱이는 모습"></canvas>
          <img id="sample-strip" class="sheet hidden" alt="견본 네 컷: 바다에 하트 볼, 노을에 고양이 귀, 분홍 배경에 토끼 귀, 무지개에 왕관" />
        </div>
      </figure>

      <div class="intro">
        <h1>찰칵 부스</h1>
        <p class="lede">효과, 얼굴 스티커, 배경을 골라서 찍으면 구글 드라이브에 바로 저장돼요.</p>

        <div class="controls">
          <div id="start-modes" class="segmented" role="group" aria-label="찍는 방식">
            <button type="button" data-mode="single" class="on">한 장</button>
            <button type="button" data-mode="four">네 컷</button>
            <button type="button" data-mode="boomerang">움짤</button>
          </div>
          <p id="start-hint"></p>
          <button id="start" type="button" aria-label="카메라 켜고 시작"></button>
          <p id="error"></p>
        </div>
      </div>
    </div>
  </div>

  <!-- 카메라 화면 오른쪽 위: 켜고 끄거나 고르는 도구 (아이콘은 흰 선으로 직접 그림) -->
  <div id="tools" class="hidden">
    <button id="sticker-btn" class="tool" type="button" aria-label="얼굴 스티커 고르기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 9.5 4.5 3.8l4.6 3M18.5 9.5l1-5.7-4.6 3" /><circle cx="12" cy="13.5" r="7.5" /><path d="M9.3 12.6v.4M14.7 12.6v.4M9.6 16.2c1.4 1.2 3.4 1.2 4.8 0" /></svg>
      <span>스티커</span>
    </button>
    <button id="bg-btn" class="tool" type="button" aria-label="배경 고르기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3" /><circle cx="16" cy="9" r="1.6" /><path d="m3.5 17 5-5.2 4 4 2.6-2.6 5.4 4.8" /></svg>
      <span>배경</span>
    </button>
    <button id="hand-btn" class="tool" type="button" aria-pressed="false" aria-label="손바닥을 보여 주면 찍기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12.5V5.5M11 11.5V3.8M14 11.5V4.5M17 12.5V7.5M17 12.5v2.2a6 6 0 0 1-6 6h-.4a5.8 5.8 0 0 1-4.8-2.6L3.6 14.6a1.6 1.6 0 0 1 2.6-1.8L8 15v-2.5" /></svg>
      <span>손</span>
    </button>
  </div>
  <!-- 스티커·배경 고르는 줄 (받침 바로 위) -->
  <div id="picker" class="hidden" role="group"></div>
  <input id="photo" type="file" accept="image/*" hidden />

  <!-- 카메라 아래 검은 받침: 찍는 방식, 효과, 셔터, 방금 찍은 사진. 카메라 화면은 이 위쪽만 쓴다 -->
  <footer id="bar" class="deck hidden">
    <div id="mode" class="segmented hidden" role="group" aria-label="찍는 방식">
      <button type="button" data-mode="single" class="on">한 장</button>
      <button type="button" data-mode="four">네 컷</button>
      <button type="button" data-mode="boomerang">움짤</button>
    </div>
    <div class="deck-row">
      <button id="effects" class="deck-btn" type="button" aria-label="효과 고르기">
        <span class="ring"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="4.5" height="4.5" rx="1" /><rect x="9.75" y="3.5" width="4.5" height="4.5" rx="1" /><rect x="16" y="3.5" width="4.5" height="4.5" rx="1" /><rect x="3.5" y="9.75" width="4.5" height="4.5" rx="1" /><rect x="9.75" y="9.75" width="4.5" height="4.5" rx="1" /><rect x="16" y="9.75" width="4.5" height="4.5" rx="1" /><rect x="3.5" y="16" width="4.5" height="4.5" rx="1" /><rect x="9.75" y="16" width="4.5" height="4.5" rx="1" /><rect x="16" y="16" width="4.5" height="4.5" rx="1" /></svg></span>
        <span>효과</span>
      </button>
      <button id="shutter" type="button" aria-label="사진 찍기"></button>
      <button id="thumb" type="button" aria-label="방금 찍은 사진">
        <img id="thumb-img" alt="" />
        <span id="thumb-badge"></span>
      </button>
    </div>
  </footer>

  <footer id="grid-bar" class="deck hidden">
    <div class="deck-row">
      <button id="prev" class="deck-btn" type="button" aria-label="이전 효과">
        <span class="ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.5 6-6 6 6 6" /></svg></span>
      </button>
      <span id="page"></span>
      <button id="next" class="deck-btn" type="button" aria-label="다음 효과">
        <span class="ring"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6 6 6-6 6" /></svg></span>
      </button>
    </div>
  </footer>

  <!-- 한 장·네 컷을 찍으면 뜨는 결과 화면. 사진이 위쪽 기계 구멍에서 뽑혀 나온다 (모양·색·글씨 고르고 저장) -->
  <div id="result" class="hidden">
    <div class="result-print">
      <div class="slot" aria-hidden="true"></div>
      <div class="result-paper">
        <img id="result-img" alt="꾸민 사진 미리보기" />
      </div>
    </div>
    <div id="result-controls">
      <div id="layouts" class="segmented" role="group" aria-label="모양"></div>
      <div id="colors" role="group" aria-label="프레임 색"></div>
      <input id="caption" type="text" maxlength="20" placeholder="아래에 넣을 글씨 (비우면 없음)" aria-label="아래에 넣을 글씨" />
      <div id="result-actions">
        <button id="retake" type="button">다시 찍기</button>
        <button id="save" type="button">저장</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
